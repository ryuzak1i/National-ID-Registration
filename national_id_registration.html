<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National ID Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="180x180" href="download.png">
    <style>
        html {
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f6faff;
            color: rgb(45, 18, 18);
            display: flex;
            flex-direction: column;
            align-items: center; 
            padding: 20px;
        }

        h1 {
            font-family: 'Urbanist', sans-serif;
            .text-yellow {
                color: #FFC000; 
            }

            .text-blue {
                color: #1a36c6;
            }

            .text-red {
                color: #cc0000; 
            }
            font-size: 40px;
        }

        form, #preview-panel {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-family: 'Open Sans', sans-serif;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"], 
        input[type="tel"], 
        input[type="email"], 
        input[type="password"] {

            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.3s ease;
            box-sizing: border-box; 
        }

        .error-message {
            color: #cc0000;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 600;
            display: block;
        }


        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #displayBtn {
            background-color: #2b6cb0;
            color: white;
        }

        #clearBtn {
            background-color: #e2e8f0;
            color: #2d3748;
        }

        #gender-message {
            font-size: 13px;
            color: #d97706;
            margin-top: 8px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 500;
        }

        #preview-panel {
            display: none; 
        }

        #preview-panel h2 {
            font-family: 'Open Sans', sans-serif;
            margin-top: 0;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
        }

        .preview-item {
            margin-bottom: 10px;
            font-family: 'Outfit', sans-serif;
        }
        
        .preview-item strong {
            font-family: 'Open Sans', sans-serif;
        }

        
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <span class="text-yellow">#</span><span class="text-blue">National</span><span class="text-red">ID</span> Registration
        </h1>
    </div>

    <form id="registrationForm">
        <fieldset style="border: 1px solid #cbd5e0; border-radius: 8px; padding: 20px;">
            <legend style="font-family: 'Open Sans'; font-weight: 600; padding: 0 10px;">Personal Information</legend>

            <div class="form-group">
                <label for="firstname">First Name</label><br>
                <input type="text" id="firstname" name="firstname" placeholder="Enter First Name" required autofocus maxlength="50">
            </div>

            <div class="form-group">
                <label for="middlename">Middle Name</label><br>
                <input type="text" id="middlename" name="middlename" placeholder="Enter Middle Name" maxlength="50">
            </div>
            
            <div class="form-group">
                <label for="lastname">Last Name</label><br>
                <input type="text" id="lastname" name="lastname" placeholder="Enter Last Name" required maxlength="50">
            </div>

            <div class="form-group">
                <label for="birthday">Date of Birth</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <div class="form-group">
                <label>Gender</label><br>
                <input type="radio" id="male" name="gender" value="Male" checked>
                <label for="male" style="font-weight:normal;">Male</label>
                
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female" style="font-weight:normal;">Female</label>
                
                <div id="gender-message">Selected Gender: Male</div>
            </div>

            <div class="form-group">
                <label for="address">Address</label><br>
                <input type="text" id="address" name="address" placeholder="Enter your complete address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label><br>
                <input type="tel" id="phone" name="phone" placeholder="09XX XXX XXXX" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label><br>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="pass">Password</label><br>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>


        </fieldset>

        <div class="button-group">
            <button type="button" id="displayBtn">Display Information</button>
            <button type="button" id="clearBtn">Clear Form</button>
        </div>
    </form>

    <div id="preview-panel">
        <h2>Registration Preview</h2>

        <div class="preview-item">
            <strong>Full Name:</strong> <span id="prev-fullname"></span>
        </div>

        <div class="preview-item">
            <strong>Date of Birth:</strong> <span id="prev-dob"></span>
        </div>

        <div class="preview-item">
            <strong>Gender:</strong> <span id="prev-gender"></span>
        </div>

        <div class="preview-item">
            <strong>Address:</strong> <span id="prev-address"></span>
        </div>

        <div class="preview-item">
            <strong>Phone Number:</strong> <span id="prev-phone"></span>
        </div>

        <div class="preview-item">
            <strong>Email Address:</strong> <span id="prev-email"></span>
        </div>
    </div>

    <script>
        const displayBtn = document.getElementById('displayBtn');
        const clearBtn = document.getElementById('clearBtn');
        const previewPanel = document.getElementById('preview-panel');
        const registrationForm = document.getElementById('registrationForm');

        const textInputs = document.querySelectorAll('input[type="text"], input[type="date"], input[type="tel"], input[type="email"]');
        const genderRadios = document.querySelectorAll('input[name="gender"]');
        const genderMessage = document.getElementById('gender-message');

        const nameRegex = /^[A-Za-z]+$/;
        const phoneRegex = /^09\d{9}$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+={}\[\]|\\:;"'<>,.?/-]).{8,}$/;

        function setError(id, message, isError = true) {
            const inputEl = document.getElementById(id);
            const errorEl = document.getElementById(`error-${id}`);
            if (isError) {
                errorEl.textContent = message;
                inputEl.style.borderColor = '#cc0000';
                inputEl.style.backgroundColor = '#fff0f0';
            } else {
                errorEl.textContent = '';
                inputEl.style.borderColor = '#ccc';
                inputEl.style.backgroundColor = 'white';
            }
        }
        
        displayBtn.addEventListener('click', function() {
            if (!registrationForm.checkValidity()) {
                registrationForm.reportValidity(); 
                return;
            }
        
            const fName = document.getElementById('firstname').value;
            const mName = document.getElementById('middlename').value;
            const lName = document.getElementById('lastname').value;
            const dob = document.getElementById('birthday').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;

            let selectedGender = 'Male';
                genderRadios.forEach(radio => {
                    if (radio.checked)
                        selectedGender = radio.value;
                });
                
        document.getElementById('prev-fullname').textContent = `${fName} ${mName} ${lName}`.trim();
            document.getElementById('prev-dob').textContent = dob;
            document.getElementById('prev-gender').textContent = selectedGender;
            document.getElementById('prev-address').textContent = address;
            document.getElementById('prev-phone').textContent = phone;
            document.getElementById('prev-email').textContent = email;

        previewPanel.style.display = 'block';

        alert('Registration Successful!');
        });

        // Clear Form
        clearBtn.addEventListener('click', function() {
            registrationForm.reset(); // Clear all

            // Clear preview text 
            document.getElementById('prev-fullname').textContent = '';
            document.getElementById('prev-dob').textContent = '';
            document.getElementById('prev-gender').textContent = '';
            document.getElementById('prev-address').textContent = '';
            document.getElementById('prev-phone').textContent = '';
            document.getElementById('prev-email').textContent = '';

            // Hide preview panel
            previewPanel.style.display = 'none';

            // Reset
            genderMessage.textContent = 'Selected Gender: Male';
        });

        textInputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.backgroundColor = '#ebf8ff'; 
                this.style.borderColor = '#3182ce';
            });
            
            input.addEventListener('blur', function() {
                this.style.backgroundColor = 'white';
                this.style.borderColor = '#ccc';
            });
        });

        genderRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                genderMessage.textContent = `Selected Gender: ${this.value}`;
            });
        });

        displayBtn.addEventListener('mouseover', function() {
            this.style.backgroundColor = '#2c5282';
        });

        displayBtn.addEventListener('mouseout', function() {
            this.style.backgroundColor = '#2b6cb0'; 
        });
    </script>
</body>
</html>
